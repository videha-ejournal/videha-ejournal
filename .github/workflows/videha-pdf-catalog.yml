name: Build Videha PDF Catalogue
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/videha-pdf-catalog.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videha-pdf-catalog-main
  cancel-in-progress: true
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build lightweight PDF catalogue
        run: python3 tools/build-videha-pdf-catalog.py . data/videha-pdf-catalog.json
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videha-pdf-catalog.json
          if git diff --cached --quiet; then echo "PDF catalogue unchanged."; else git commit -m "Build Videha PDF catalogue" && git push; fi

name: Build Videha PDF Catalogues
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/videha-pdf-catalog.yml'
      - 'tools/build-videha-pdf-catalog.py'
      - 'tools/build-videha-federated-pdf-catalog.py'
      - 'data/federated-pdf-metadata.json'
  push:
    branches: [main]
    paths-ignore:
      - 'data/videha-pdf-catalog.json'
      - 'data/videha-federated-pdf-catalog.json'
      - 'data/videha-federated-pdf-review.json'
permissions:
  contents: write
concurrency:
  group: videha-pdf-catalog-main
  cancel-in-progress: true
jobs:
  validate-builders:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check catalogue builders
        run: python3 -m py_compile tools/build-videha-pdf-catalog.py tools/build-videha-federated-pdf-catalog.py
  build-catalogues:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build authoritative repository PDF catalogue
        run: python3 tools/build-videha-pdf-catalog.py . data/videha-pdf-catalog.json
      - name: Discover Videha PDFs across repositories and verify SHA-256 incrementally
        run: python3 tools/build-videha-federated-pdf-catalog.py . data/videha-federated-pdf-catalog.json data/videha-federated-pdf-review.json
      - name: Commit generated catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videha-pdf-catalog.json data/videha-federated-pdf-catalog.json data/videha-federated-pdf-review.json
          if git diff --cached --quiet; then echo "PDF catalogues unchanged."; else git commit -m "Build Videha PDF catalogues" && git push; fi

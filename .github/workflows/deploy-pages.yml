name: Deploy slim Videha Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare slim publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir publish
          find . -maxdepth 1 -type f \( -name '*.htm' -o -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' -o -name '*.json' \) -exec cp --parents {} publish/ \;
          find . -maxdepth 1 -type f -name 'editorial_samagra_*.pdf' -exec cp --parents {} publish/ \;
          # Keep explicitly published book PDFs available without packaging the full PDF corpus.
          for f in kurukshetram_kadambari.pdf; do
            if [ -f "$f" ]; then cp --parents "$f" publish/; fi
          done
          for d in assets research search-documents data; do
            if [ -d "$d" ]; then cp -a "$d" publish/; fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload slim Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

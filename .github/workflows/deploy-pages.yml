name: Deploy slim Videha Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare slim publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir publish
          find . -maxdepth 1 -type f \( -name '*.htm' -o -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' -o -name '*.json' \) -exec cp --parents {} publish/ \;
          find . -maxdepth 1 -type f -name 'editorial_samagra_*.pdf' -exec cp --parents {} publish/ \;
          # Keep explicitly published book PDFs available without packaging the full PDF corpus.
          for f in kurukshetram_kadambari.pdf Kurukshetram_English.pdf VIDEHA_Parallel_History.pdf Water_Burial_Children.pdf Water_Burial_Young.pdf CODE_NAME.pdf New_Wings.pdf editorial_samagra.pdf Gajendra_Thakur_Samagra_Sampadakiya.pdf Gajendra_Thakur_82_Selected_Stories.pdf katha_saar.pdf Narratology_Maithili.pdf Gajendra_Thakur_Samagra_PNS2.pdf VIDEHA_Parallel_History2.pdf Bharat_2027.pdf Bharat_2027_English.pdf VIDEHA_Parallel_History3.pdf Gajendra_Thakur_Samagra_Sampadakiya2.pdf BHARAT_2027_TEACHER.pdf NAVYA_NYAYA_NOVEL_TEACHER.pdf Parallel_History_Teacher_I.pdf Parallel_History_Teacher_III.pdf The_Translator_Teacher.pdf Parallel_History_Teacher_II.pdf Atmatattvaviveka_Teacher.pdf Bhamati_Teacher.pdf Kurukshetram_Teacher.pdf Mithila_Vajji_Anga_I_Teacher.pdf Mithila_Vajji_Anga_II_Teacher.pdf Nyayakusumanjali_Teacher.pdf Parallel_Philosophy_I_Teacher.pdf Parallel_Philosophy_II_Teacher.pdf Tattvacintamani_Teacher.pdf; do
            if [ -f "$f" ]; then cp --parents "$f" publish/; fi
          done
          for d in assets research search-documents data; do
            if [ -d "$d" ]; then cp -a "$d" publish/; fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload slim Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
